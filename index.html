<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>New Tab</title>
        <link rel="stylesheet" href="./index.css">
    </head>
    <body>
        <div id="top">
            <div id="goals">
                <span id="goals-top">Today's Goal:</span>
                <span id="goal"></span>
            </div>
            <div id="search-bar">
                <form id="search-bar-form">
                    <label for="search-bar-input">Title</label>
                    <input id="search-bar-input" name="search-bar-input" type="text" placeholder="Spider-Man">
                    <button>Change title</button>
                </form>
                <form id="change-backdrop-form">
                    <label for="backdrop-number">Backdrop #</label>
                    <input type="text" id="backdrop-number" name="backdrop-number" maxlength="3" pattern="[0-9]{1,}" placeholder="0" required>
                    <button id="change-backdrop-btn">Change backdrop</button>
                </form>
            </div>
        </div>
        <div id="center">
            <span id="time"></span>
            <span id="tagline"></span>
        </div>
        <div id="bottom">
            <div id="poster-container"></div>
            <div id="title-info">
                <span id="title">Title: Spider-Man</span>
                <span id="nsfw-warning"></span>
            </div>
            <div id="settings">
                <a id="open-settings-link" href="./pages/settings.html">Open Settings</a>
                <div id="current-backdrop-overview">
                    <span id="current-backdrop"></span>
                    <div id="lock-movie-setting">
                        <button id="lock-movie-btn">Lock movie</button>
                        <span id="lock-movie-icon">🔓</span>
                    </div>
                    <div id="lock-backdrop-setting">
                        <button id="lock-backdrop-btn">Lock backdrop</button>
                        <span id="lock-backdrop-icon">🔓</span>
                    </div>
                </div>
            </div>
        </div>
        <div id="notice">
            <span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
            <img id="credit-logo" src="./images/tmdb_logo_long.svg">
            <a href="./pages/credits.html">Credits</a>
        </div>  
        <script src="./index.js"></script>
    </body>
</html>
