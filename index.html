<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
        <title>New Tab</title>
        <link rel="stylesheet" href="./index.css">
    </head>
    <body>
        <!-- <header id="header"> -->
            <div id="bookmarks-bar"></div>
        <!-- </header> -->
        <!-- <main id="main"> -->
            <div id="top">
                <div id="goals">
                    <span id="goals-top">Today's Goal:</span>
                    <span class="goal">🎯Finish this app.</span>
                </div>
                <div id="search-bar">
                    <form id="search-bar-form">
                        <input id="search-bar-input" type="text" placeholder="Spider-Man">

                    </form>
                </div>
            </div>
            <div id="center">
                <span id="time"></span>
                <span id="quote">"With great power comes great responsibility."</span>
            </div>
            <div id="bottom">
                <div id="poster-container"></div>
                <span id="title">Title: Spider-Man</span>
                <div id="settings">
                    <a id="open-settings-link" href="./pages/settings.html">Open Settings</a>
                    <div>
                        <button id="lock-screen-btn">Lock screen</button>
                        <span id="lock-screen-icon">🔓</span>
                    </div>
                </div>
            </div>
        <!-- </main> -->
        <script src="./index.js"></script>
    </body>
