<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="./index.css">
    </head>
    <body>
        <div id="top">
            <div id="goals">
                <span id="goals-top">Today's Goals:</span>
                <span>🎯Finish this app.</span>
                <span>🎯Do the laundry.</span>
                <span>🎯Read a book.</span>
            </div>
            <div id="search-bar">
                <form id="search-bar-form">
                    <input id="search-bar-input" type="text" placeholder="Spider-Man">
                    <button>Change Title</button>
                </form>
            </div>
        </div>
        <div id="center">
            <span id="time"></span>
            <span id="quote">"With great power comes great responsiblity."</span>
        </div>
        <div id="bottom">
            <div id="poster-container"></div>
            <span id="title">Title: Spider-Man</span>
            <span>Open Settings</span>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
