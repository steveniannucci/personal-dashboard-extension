<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>New Tab</title>
        <link rel="stylesheet" href="../settings.css">
    </head>
    <body>
        <a href="../index.html">Go Back to Dashboard</a>
        <h1>Dashboard Settings</h1>
        <form id="settings-form">
            <fieldset id="colors-fieldset">
                <legend>Colors</legend>
                <div class="color-field">
                    <label for="text-color">Text</label>
                    <input type="color" id="text-color" name="text-color"/>
                </div>
                <div class="color-field">
                    <label for="outline">Outline</label>
                    <input type="color" id="outline-color" name="outline-color" />
                </div>
                <div class="preview-field">
                    <label>Preview:</label>
                    <span id="preview"></span>
                </div>
            </fieldset>
            <fieldset id="tagline-fieldset">
                <legend>Tagline</legend>
                <div class="checkbox-field">
                    <label for="display-tagline">Display tagline</label>
                    <input type="checkbox" id="display-tagline" name="display-tagline"/>
                </div>
                <span>Note: Taglines will only be displayed for movies that have it.</span>
            </fieldset>
            <fieldset id="nsfw-fieldset">
                <legend>NSFW</legend>
                <div class="checkbox-field">
                    <label for="allow-adult">Adult</label>
                    <input type="checkbox" id="allow-adult" name="allow-adult"/>
                </div>
                <div class="checkbox-field">
                    <label for="allow-horror">Horror</label>
                    <input type="checkbox" id="allow-horror" name="allow-horror" />
                </div>
            </fieldset>
            <fieldset id="goals-fieldset">
                <legend>Goals</legend>
                <label for="goal-1">Goal #1</label>
                <input type="text" id="goal-1" name="goal-1">
                <label for="goal-2">Goal #2</label>
                <input type="text" id="goal-2" name="goal-2">
                <label for="goal-3">Goal #3</label>
                <input type="text" id="goal-3" name="goal-3">
                <label for="goal-4">Goal #4</label>
                <input type="text" id="goal-4" name="goal-4">
                <label for="goal-5">Goal #5</label>
                <input type="text" id="goal-5" name="goal-5">
            </fieldset>
            <button id="save-changes-btn">Save Changes</button>
        </form>
        <a href="../index.html">
            <button id="back-to-dashboard-btn">Go Back to Dashboard</button>
        </a>
        <script src="../settings.js"></script>
    </body>
</html>
